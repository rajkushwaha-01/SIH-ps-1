services:
  - type: web
    name: anpr-backend
    runtime: node
    buildCommand: npm ci --prefix backend && npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: anpr-ml
    runtime: python
    buildCommand: pip install -r Ml-service/requirements.txt
    startCommand: python Ml-service/app.py
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: ../models/custom_trained_model.pt

  - type: web
    name: anpr-frontend
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
